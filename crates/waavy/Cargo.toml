[package]
name = "waavy"
version = "0.3.0-dev.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Rust client for the waavy React renderer: render React pages from Rust over HTTP or one-shot."
repository = "https://github.com/mega-blastoise/bundt"
homepage = "https://github.com/mega-blastoise/bundt/tree/main/crates/waavy"
readme = "README.md"
keywords = ["react", "ssr", "html", "render", "hydration"]
categories = ["web-programming", "template-engine"]

[features]
default = ["oneshot"]
# Spawn `waavy render --stdin` instead of talking to a running server.
oneshot = ["tokio/process"]

[dependencies]
bytes = "1.12.1"
futures-core = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Not the workspace tokio: that enables "full", which a library must not force on its users.
tokio = { version = "1", features = ["net", "io-util", "time", "rt"] }

[dev-dependencies]
axum = "0.8.9"
jsonschema = { version = "0.33.0", default-features = false }
tokio = { workspace = true, features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
