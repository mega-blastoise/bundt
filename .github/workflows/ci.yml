name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun run typecheck -- --filter="...[HEAD^1]"
          else
            bun run typecheck
          fi

      - name: Build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun run build -- --filter="...[HEAD^1]"
          else
            bun run build
          fi

      - name: Test
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun run test -- --filter="...[HEAD^1]"
          else
            bun run test
          fi

      # waavy's real-browser hydration tests (packages/waavy/e2e). They need
      # the package build from the steps above and a Playwright Chromium.
      - name: Install Playwright Chromium (waavy e2e)
        working-directory: packages/waavy
        run: bunx playwright install --with-deps chromium

      - name: Waavy e2e
        working-directory: packages/waavy
        run: |
          bun run build
          bun run test:e2e

  # crates/waavy against the real compiled waavy binary, plus the Rust-host
  # (axum) browser test. See .claude/specs/waavy/WAAVY_P2_SERVE_RS.md.
  waavy-rs:
    name: waavy Rust client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('crates/**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Build waavy binary and fixture release
        run: scripts/waavy-rs-prepare.sh --env-file >> "$GITHUB_ENV"

      - name: Clippy
        run: cargo clippy -p waavy --all-targets -- -D warnings

      - name: Test
        run: cargo test -p waavy

      - name: Install Playwright Chromium
        working-directory: packages/waavy
        run: bunx playwright install --with-deps chromium

      - name: Rust host browser test (axum)
        working-directory: packages/waavy
        env:
          WAAVY_E2E_AXUM: "1"
        run: bun test e2e/axum.test.ts
